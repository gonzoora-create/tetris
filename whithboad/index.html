<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whiteboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>화이트보드</h1>
    <button id="new-board-btn">+ 새 보드 만들기</button>
  </header>
  <main>
    <section id="recent-boards">
      <h2>최근 보드</h2>
      <ul id="board-list"></ul>
      <p id="empty-msg" hidden>아직 보드가 없습니다. 새 보드를 만들어보세요.</p>
    </section>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
