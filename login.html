<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — 칸반 보드</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">칸반 보드</h1>

      <div class="tabs" role="tablist">
        <button class="tab active" id="tabLogin" role="tab" aria-selected="true">로그인</button>
        <button class="tab" id="tabSignup" role="tab" aria-selected="false">회원가입</button>
      </div>

      <!-- 로그인 폼 -->
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginEmail">이메일</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="loginPassword">비밀번호</label>
          <input type="password" id="loginPassword" placeholder="비밀번호 입력" required autocomplete="current-password" />
        </div>
        <p id="loginError" class="msg error" aria-live="polite"></p>
        <button type="submit" id="loginBtn" class="btn-primary">로그인</button>
      </form>

      <!-- 회원가입 폼 -->
      <form id="signupForm" novalidate hidden>
        <div class="field">
          <label for="signupEmail">이메일</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="signupPassword">비밀번호</label>
          <input type="password" id="signupPassword" placeholder="6자 이상" required autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="signupPasswordConfirm">비밀번호 확인</label>
          <input type="password" id="signupPasswordConfirm" placeholder="비밀번호 재입력" required autocomplete="new-password" />
        </div>
        <p id="signupError" class="msg error" aria-live="polite"></p>
        <p id="signupSuccess" class="msg success" aria-live="polite"></p>
        <button type="submit" id="signupBtn" class="btn-primary">회원가입</button>
      </form>

    </div>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
