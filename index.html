<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>칸반 보드</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <h1>칸반 보드</h1>
    <div class="user-info">
      <span id="userEmail" class="user-email"></span>
      <button id="logoutBtn" class="logout-btn">로그아웃</button>
    </div>
  </header>

  <form class="add-card-form" id="addCardForm">
    <input
      type="text"
      id="cardInput"
      placeholder="새 카드 내용 입력..."
      required
      autocomplete="off"
    />
    <select id="columnSelect">
      <option value="todo">To-Do</option>
      <option value="inprogress">In Progress</option>
      <option value="done">Done</option>
    </select>
    <button type="submit">+ 추가</button>
  </form>

  <main class="board">

    <!-- To-Do 컬럼 -->
    <section class="column" id="col-todo">
      <div class="column-header todo-header">
        <span class="column-title">To-Do</span>
        <span class="badge" id="badge-todo">0</span>
      </div>
      <ul class="card-list" id="todo" data-column="todo">
        <li class="card" draggable="true">
          <span class="card-text">요구사항 분석하기</span>
          <button class="delete-btn" aria-label="삭제">×</button>
        </li>
        <li class="card" draggable="true">
          <span class="card-text">UI 디자인 시안 작성</span>
          <button class="delete-btn" aria-label="삭제">×</button>
        </li>
        <li class="card" draggable="true">
          <span class="card-text">DB 스키마 설계</span>
          <button class="delete-btn" aria-label="삭제">×</button>
        </li>
        <li class="card" draggable="true">
          <span class="card-text">테스트 케이스 작성</span>
          <button class="delete-btn" aria-label="삭제">×</button>
        </li>
      </ul>
    </section>

    <!-- In Progress 컬럼 -->
    <section class="column" id="col-inprogress">
      <div class="column-header inprogress-header">
        <span class="column-title">In Progress</span>
        <span class="badge" id="badge-inprogress">0</span>
      </div>
      <ul class="card-list" id="inprogress" data-column="inprogress">
        <li class="card" draggable="true">
          <span class="card-text">API 엔드포인트 개발</span>
          <button class="delete-btn" aria-label="삭제">×</button>
        </li>
        <li class="card" draggable="true">
          <span class="card-text">로그인 페이지 구현</span>
          <button class="delete-btn" aria-label="삭제">×</button>
        </li>
      </ul>
    </section>

    <!-- Done 컬럼 -->
    <section class="column" id="col-done">
      <div class="column-header done-header">
        <span class="column-title">Done</span>
        <span class="badge" id="badge-done">0</span>
      </div>
      <ul class="card-list" id="done" data-column="done">
        <li class="card" draggable="true">
          <span class="card-text">프로젝트 초기 셋업</span>
          <button class="delete-btn" aria-label="삭제">×</button>
        </li>
        <li class="card" draggable="true">
          <span class="card-text">Git 저장소 생성</span>
          <button class="delete-btn" aria-label="삭제">×</button>
        </li>
      </ul>
    </section>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
